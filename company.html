<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>업체 정보 - GOMANGO 점주 운영 게시판</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/style.css?v=20260921e">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
  <div id="gnb"></div>

  <main class="page-main">
    <div class="page-header">
      <div>
        <h1 class="page-title">업체 정보</h1>
        <p class="page-subtitle">재료·장비 공급업체, AS 센터 등 매장 운영에 필요한 연락처 모음입니다</p>
      </div>
      <button id="writeBtn" class="btn-primary hidden">+ 업체 등록</button>
    </div>

    <div id="writeForm" class="form-card hidden">
      <div class="form-row">
        <div class="form-field" style="flex:2;">
          <label>업체명</label>
          <input id="f_name" type="text" placeholder="예: 대한 제빙 유통">
        </div>
        <div class="form-field">
          <label>구분</label>
          <select id="f_category">
            <option value="재료">재료</option>
            <option value="장비/AS">장비/AS</option>
            <option value="포장재">포장재</option>
            <option value="기타">기타</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-field">
          <label>담당자</label>
          <input id="f_contact" type="text" placeholder="예: 김담당">
        </div>
        <div class="form-field">
          <label>연락처</label>
          <input id="f_phone" type="text" placeholder="02-000-0000">
        </div>
        <div class="form-field">
          <label>이메일 (선택)</label>
          <input id="f_email" type="email" placeholder="contact@company.com">
        </div>
      </div>
      <div class="form-field">
        <label>비고 (선택)</label>
        <textarea id="f_notes" placeholder="배송 요일, 주의사항 등"></textarea>
      </div>
      <div id="formError" class="error-text hidden"></div>
      <div style="display:flex; gap:10px;">
        <button id="submitBtn" class="btn-primary">등록</button>
        <button id="cancelBtn" class="btn-link">취소</button>
      </div>
    </div>

    <div id="companyList" class="card-grid"><div class="empty-state">불러오는 중...</div></div>
  </main>

  <script src="assets/supabaseClient.js?v=20260921e"></script>
  <script src="assets/app.js?v=20260921e"></script>
  <script>
    let profileRef = null;
    let editingId = null;
    let allCompanies = [];

    // 순서를 바꾼 뒤(위/아래), 전체 목록의 sort_order를 새 순서대로 다시 매겨서 저장합니다.
    // 이렇게 재정렬해서 저장해두면, 초기 데이터에 sort_order가 없거나 값이 겹쳐도 항상 정상적으로 동작합니다.
    async function moveCompany(id, direction) {
      const list = [...allCompanies];
      const idx = list.findIndex((c) => c.id === id);
      const swapIdx = direction === "up" ? idx - 1 : idx + 1;
      if (idx === -1 || swapIdx < 0 || swapIdx >= list.length) return;
      [list[idx], list[swapIdx]] = [list[swapIdx], list[idx]];
      for (let i = 0; i < list.length; i++) {
        const newOrder = (i + 1) * 10;
        if (list[i].sort_order !== newOrder) {
          await sb.from("companies").update({ sort_order: newOrder }).eq("id", list[i].id);
        }
      }
      loadCompanies();
    }

    function resetForm() {
      editingId = null;
      ["f_name", "f_contact", "f_phone", "f_email", "f_notes"].forEach((id) => (document.getElementById(id).value = ""));
      document.getElementById("f_category").value = "재료";
      document.getElementById("submitBtn").textContent = "등록";
      document.getElementById("writeForm").classList.add("hidden");
      if (isVisor(profileRef)) document.getElementById("writeBtn").classList.remove("hidden");
      if (document.activeElement) document.activeElement.blur();
    }

    function startEdit(c) {
      editingId = c.id;
      document.getElementById("f_name").value = c.name;
      document.getElementById("f_category").value = c.category;
      document.getElementById("f_contact").value = c.contact_name || "";
      document.getElementById("f_phone").value = c.phone || "";
      document.getElementById("f_email").value = c.email || "";
      document.getElementById("f_notes").value = c.notes || "";
      document.getElementById("submitBtn").textContent = "수정 저장";
      document.getElementById("writeForm").classList.remove("hidden");
      document.getElementById("writeBtn").classList.add("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderCompanies() {
      const listEl = document.getElementById("companyList");
      if (!allCompanies.length) {
        listEl.innerHTML = '<div class="empty-state">등록된 업체 정보가 없습니다</div>';
        return;
      }
      listEl.innerHTML = allCompanies.map((c, idx) => `
        <div class="card" style="display:flex; flex-direction:column; gap:8px;">
          <div style="display:flex; align-items:center; gap:8px;">
            <span class="pill ${categoryPillClass(c.category)}">${escapeHtml(c.category)}</span>
            <span style="font-size:16px; font-weight:700;">${escapeHtml(c.name)}</span>
          </div>
          ${c.contact_name ? `<div style="font-size:13.5px; color:var(--ink-soft);">담당자: ${escapeHtml(c.contact_name)}</div>` : ""}
          ${c.phone ? `<div style="font-size:13.5px;"><a class="phone-link" href="${toTelHref(c.phone)}"><span class="phone-icon">📞</span>${escapeHtml(c.phone)}</a></div>` : ""}
          ${c.email ? `<div style="font-size:13.5px; color:var(--ink-soft);">이메일: ${escapeHtml(c.email)}</div>` : ""}
          ${c.notes ? `<div style="font-size:13px; color:var(--muted); white-space:pre-line; margin-top:4px;">${escapeHtml(c.notes)}</div>` : ""}
          <div style="font-size:12px; color:var(--muted); margin-top:2px;">${metaDateLabel(c)} 등록</div>
          ${isVisor(profileRef) ? `
            <div class="row-actions" style="margin-top:6px;">
              <button class="btn-edit" data-id="${c.id}" data-action="move-up" ${idx === 0 ? "disabled" : ""}>↑</button>
              <button class="btn-edit" data-id="${c.id}" data-action="move-down" ${idx === allCompanies.length - 1 ? "disabled" : ""}>↓</button>
              <button class="btn-edit" data-id="${c.id}" data-action="edit">수정</button>
              <button class="btn-delete" data-id="${c.id}" data-action="delete">삭제</button>
            </div>
          ` : ""}
        </div>
      `).join("");

      listEl.querySelectorAll("[data-action='move-up']").forEach((btn) => {
        btn.addEventListener("click", () => moveCompany(btn.dataset.id, "up"));
      });
      listEl.querySelectorAll("[data-action='move-down']").forEach((btn) => {
        btn.addEventListener("click", () => moveCompany(btn.dataset.id, "down"));
      });
      listEl.querySelectorAll("[data-action='edit']").forEach((btn) => {
        btn.addEventListener("click", () => {
          const c = allCompanies.find((x) => x.id === btn.dataset.id);
          if (c) startEdit(c);
        });
      });
      listEl.querySelectorAll("[data-action='delete']").forEach((btn) => {
        btn.addEventListener("click", async () => {
          if (!confirm("이 업체 정보를 삭제할까요? 삭제하면 되돌릴 수 없습니다.")) return;
          const { error } = await sb.from("companies").delete().eq("id", btn.dataset.id);
          if (error) {
            alert("삭제에 실패했습니다: " + error.message);
            return;
          }
          loadCompanies();
        });
      });
    }

    async function loadCompanies() {
      const { data, error } = await sb.from("companies").select("*").order("sort_order", { ascending: true }).order("created_at", { ascending: false });
      const listEl = document.getElementById("companyList");
      if (error) {
        listEl.innerHTML = `<div class="empty-state">불러오기 실패: ${escapeHtml(error.message)}</div>`;
        return;
      }
      allCompanies = data || [];
      renderCompanies();
    }

    (async () => {
      const auth = await requireAuth();
      if (!auth) return;
      profileRef = auth.profile;
      renderGnb("company", profileRef);
      revealPage();

      if (isVisor(profileRef)) {
        document.getElementById("writeBtn").classList.remove("hidden");
      }

      document.getElementById("writeBtn").addEventListener("click", () => {
        document.getElementById("writeForm").classList.remove("hidden");
        document.getElementById("writeBtn").classList.add("hidden");
        document.getElementById("writeForm").scrollIntoView({ behavior: "smooth", block: "center" });
      });
      document.getElementById("cancelBtn").addEventListener("click", () => {
        resetForm();
      });

      document.getElementById("submitBtn").addEventListener("click", async () => {
        const errEl = document.getElementById("formError");
        clearFormError(errEl);
        const name = document.getElementById("f_name").value.trim();
        const category = document.getElementById("f_category").value;
        const contact_name = document.getElementById("f_contact").value.trim() || null;
        const phone = document.getElementById("f_phone").value.trim() || null;
        const email = document.getElementById("f_email").value.trim() || null;
        const notes = document.getElementById("f_notes").value.trim() || null;

        if (!name) {
          showFormError(errEl, "업체명을 입력해주세요.");
          return;
        }

        const payload = { name, category, contact_name, phone, email, notes };
        const nextSortOrder = allCompanies.length ? Math.max(...allCompanies.map((c) => c.sort_order || 0)) + 10 : 10;
        const { error } = editingId
          ? await sb.from("companies").update(payload).eq("id", editingId)
          : await sb.from("companies").insert({ ...payload, author_id: profileRef.id, sort_order: nextSortOrder });

        if (error) {
          showFormError(errEl, "저장에 실패했습니다: " + error.message);
          return;
        }

        resetForm();
        loadCompanies();
      });

      loadCompanies();
    })();
  </script>
</body>
</html>
