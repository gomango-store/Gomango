<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>건의함 - GOMANGO 점주 운영 게시판</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/style.css?v=20260921d">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
  <div id="gnb"></div>

  <main class="page-main">
    <div class="page-header">
      <div>
        <h1 class="page-title">건의함</h1>
        <p class="page-subtitle">바이저끼리 공유할 메모와 업무 내용을 남겨주세요</p>
      </div>
      <button id="writeBtn" class="btn-primary">+ 메모 작성</button>
    </div>

    <div id="writeForm" class="form-card hidden">
      <div class="form-field">
        <label>구분</label>
        <select id="f_type">
          <option value="업무" selected>업무</option>
          <option value="메모">메모</option>
        </select>
      </div>
      <div class="form-field">
        <label>제목</label>
        <input id="f_title" type="text" placeholder="제목을 입력하세요">
      </div>
      <div class="form-field">
        <label>내용</label>
        <textarea id="f_content" placeholder="공유할 내용을 자세히 적어주세요"></textarea>
      </div>
      <p style="font-size:12.5px; color:var(--muted); margin:0;">이 내용은 바이저 계정에게만 노출됩니다.</p>
      <div id="formError" class="error-text hidden"></div>
      <div style="display:flex; gap:10px;">
        <button id="submitBtn" class="btn-primary">등록</button>
        <button id="cancelBtn" class="btn-link">취소</button>
      </div>
    </div>

    <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;">
      <div style="display:flex; align-items:center; gap:8px;" id="statusTabs"></div>
      <input id="authorSearchInput" type="text" placeholder="🔍 작성자 검색" style="width:220px; max-width:100%; font-family:inherit; font-size:13.5px; padding:9px 12px; border:1px solid var(--border); border-radius:8px;">
    </div>

    <div id="suggestionList" style="display:flex; flex-direction:column;"><div class="empty-state">불러오는 중...</div></div>
  </main>

  <script src="assets/supabaseClient.js?v=20260921d"></script>
  <script src="assets/app.js?v=20260921d"></script>
  <script>
    let profileRef = null;
    let allSuggestions = [];
    let currentStatus = "전체";
    let authorSearchQuery = "";
    let editingId = null;

    function renderStatusTabs() {
      const statuses = ["전체", "진행중", "완료"];
      document.getElementById("statusTabs").innerHTML = statuses.map((s) => {
        const count = s === "전체" ? allSuggestions.length : allSuggestions.filter((x) => x.status === s).length;
        return `<button class="tab-pill ${s === currentStatus ? "active" : ""}" data-status="${s}">${s} ${count}</button>`;
      }).join("");
      document.querySelectorAll("#statusTabs .tab-pill").forEach((btn) => {
        btn.addEventListener("click", () => {
          currentStatus = btn.dataset.status;
          renderStatusTabs();
          renderSuggestions();
        });
      });
    }

    function startEdit(s) {
      editingId = s.id;
      document.getElementById("f_type").value = s.category || "업무";
      document.getElementById("f_title").value = s.title;
      document.getElementById("f_content").value = s.content;
      document.getElementById("submitBtn").textContent = "수정 저장";
      document.getElementById("writeForm").classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderSuggestions() {
      let filtered = currentStatus === "전체" ? allSuggestions : allSuggestions.filter((s) => s.status === currentStatus);
      if (authorSearchQuery.trim()) {
        const aq = authorSearchQuery.trim().toLowerCase();
        filtered = filtered.filter((s) => (s.profiles ? s.profiles.store_name : "").toLowerCase().includes(aq));
      }
      const listEl = document.getElementById("suggestionList");
      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="empty-state">${authorSearchQuery.trim() ? "검색 결과가 없습니다" : "등록된 메모가 없습니다"}</div>`;
        return;
      }
      listEl.innerHTML = filtered.map((s) => {
        const storeLabel = s.profiles ? s.profiles.store_name : "(탈퇴된 계정)";
        const replies = s.suggestion_replies || [];
        const replyHtml = replies.map((r) => `
          <div style="background:var(--neutral-tint); border-radius:10px; padding:14px 16px; display:flex; flex-direction:column; gap:6px; margin-top:10px;">
            <div style="display:flex; align-items:center; gap:8px;">
              <span class="pill pill-accent">댓글</span>
              <span style="font-size:12px; color:var(--muted);">${formatDateTime(r.created_at)}</span>
            </div>
            <div style="font-size:13.5px; color:var(--ink); line-height:1.55;">${escapeHtml(r.content)}</div>
          </div>
        `).join("");

        const canReply = isVisor(profileRef) && s.status === "진행중";
        const replyFormHtml = canReply ? `
          <div style="margin-top:10px; display:flex; gap:8px;">
            <input type="text" class="reply-input" data-id="${s.id}" placeholder="댓글을 입력하세요" style="flex-grow:1; font-family:inherit; font-size:13.5px; padding:9px 12px; border:1px solid var(--border); border-radius:8px;">
            <button class="btn-primary reply-submit" data-id="${s.id}" style="padding:9px 16px;">댓글 등록</button>
          </div>
        ` : "";

        const canEdit = isVisor(profileRef);
        const canDelete = isVisor(profileRef);
        const actionsHtml = (canEdit || canDelete) ? `
          <div class="row-actions" style="margin-top:10px;">
            ${canEdit ? `<button class="btn-edit" data-id="${s.id}" data-action="edit">수정</button>` : ""}
            ${canDelete ? `<button class="btn-delete" data-id="${s.id}" data-action="delete">삭제</button>` : ""}
          </div>
        ` : "";

        return `
          <div class="card suggestion-item">
            <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
              <span class="pill ${suggestionCategoryPillClass(s.category)}">${escapeHtml(s.category || "업무")}</span>
              <span class="pill ${s.status === "완료" ? "pill-green" : "pill-amber"}">${s.status}</span>
              <span style="font-size:15px; font-weight:700; flex-grow:1;">${escapeHtml(s.title)}</span>
              <span class="pill pill-info">👤 ${escapeHtml(storeLabel)}</span>
              <span style="font-size:12.5px; color:var(--muted);">${metaDateLabel(s)}</span>
            </div>
            <div style="margin-top:8px; font-size:14px; color:var(--ink-soft); line-height:1.55;">${escapeHtml(s.content)}</div>
            ${replyHtml}
            ${replyFormHtml}
            ${actionsHtml}
          </div>
        `;
      }).join("");

      listEl.querySelectorAll(".reply-submit").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const id = btn.dataset.id;
          const input = listEl.querySelector(`.reply-input[data-id="${id}"]`);
          const content = input.value.trim();
          if (!content) return;
          btn.disabled = true;
          const { error: replyError } = await sb.from("suggestion_replies").insert({
            suggestion_id: id, content, author_id: profileRef.id,
          });
          if (!replyError) {
            await sb.from("suggestions").update({ status: "완료" }).eq("id", id);
          }
          btn.disabled = false;
          loadSuggestions();
        });
      });

      listEl.querySelectorAll("[data-action='edit']").forEach((btn) => {
        btn.addEventListener("click", () => {
          const s = allSuggestions.find((x) => x.id === btn.dataset.id);
          if (s) startEdit(s);
        });
      });
      listEl.querySelectorAll("[data-action='delete']").forEach((btn) => {
        btn.addEventListener("click", async () => {
          if (!confirm("이 메모를 삭제할까요? 삭제하면 되돌릴 수 없습니다.")) return;
          const { error } = await sb.from("suggestions").delete().eq("id", btn.dataset.id);
          if (error) {
            alert("삭제에 실패했습니다: " + error.message);
            return;
          }
          loadSuggestions();
        });
      });
    }

    async function loadSuggestions() {
      const { data, error } = await sb
        .from("suggestions")
        .select("*, profiles(store_name), suggestion_replies(id, content, created_at)")
        .order("created_at", { ascending: false });
      if (error) {
        document.getElementById("suggestionList").innerHTML = `<div class="empty-state">불러오기 실패: ${escapeHtml(error.message)}</div>`;
        return;
      }
      allSuggestions = data || [];
      renderStatusTabs();
      renderSuggestions();
    }

    (async () => {
      const auth = await requireAuth();
      if (!auth) return;
      profileRef = auth.profile;
      if (!isVisor(profileRef)) {
        location.replace("home");
        return;
      }
      renderGnb("suggestions", profileRef);
      revealPage();

      document.getElementById("authorSearchInput").addEventListener("input", (e) => {
        authorSearchQuery = e.target.value;
        renderSuggestions();
      });

      // 메모 작성 폼
      document.getElementById("writeBtn").addEventListener("click", () => {
        document.getElementById("writeForm").classList.remove("hidden");
        document.getElementById("writeForm").scrollIntoView({ behavior: "smooth", block: "center" });
      });
      document.getElementById("cancelBtn").addEventListener("click", () => {
        editingId = null;
        document.getElementById("f_type").value = "업무";
        document.getElementById("f_title").value = "";
        document.getElementById("f_content").value = "";
        document.getElementById("submitBtn").textContent = "등록";
        document.getElementById("writeForm").classList.add("hidden");
        if (document.activeElement) document.activeElement.blur();
      });
      document.getElementById("submitBtn").addEventListener("click", async () => {
        const errEl = document.getElementById("formError");
        clearFormError(errEl);
        const category = document.getElementById("f_type").value;
        const title = document.getElementById("f_title").value.trim();
        const content = document.getElementById("f_content").value.trim();
        if (!title || !content) {
          showFormError(errEl, "제목과 내용을 모두 입력해주세요.");
          return;
        }
        const { error } = editingId
          ? await sb.from("suggestions").update({ category, title, content }).eq("id", editingId)
          : await sb.from("suggestions").insert({ category, title, content, owner_id: profileRef.id, status: "진행중" });
        if (error) {
          showFormError(errEl, "저장에 실패했습니다: " + error.message);
          return;
        }
        editingId = null;
        document.getElementById("f_type").value = "업무";
        document.getElementById("f_title").value = "";
        document.getElementById("f_content").value = "";
        document.getElementById("submitBtn").textContent = "등록";
        document.getElementById("writeForm").classList.add("hidden");
        if (document.activeElement) document.activeElement.blur();
        loadSuggestions();
      });

      loadSuggestions();
    })();
  </script>
</body>
</html>
