<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOMANGO 점주 운영 게시판</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/style.css?v=20260921b">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
  <div id="gnb"></div>

  <main class="page-main">
    <div id="pinnedBanner"></div>

    <div>
      <h2 class="page-title" style="font-size:20px;">빠른 메뉴</h2>
      <p class="page-subtitle">자주 찾는 메뉴를 한눈에 확인하세요</p>
    </div>

    <div class="card-grid" id="quickMenuGrid"></div>

    <div style="display:grid; grid-template-columns: 1.3fr 1fr; gap:22px;" id="recentSection">
      <div class="card">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
          <span style="font-size:16px; font-weight:700;">최근 공지사항</span>
          <a href="notices" style="font-size:13px; color:var(--muted);">전체보기</a>
        </div>
        <div id="recentNotices"><div class="empty-state">불러오는 중...</div></div>
      </div>
      <div class="card">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
          <span style="font-size:16px; font-weight:700;">최근 건의사항</span>
          <a href="suggestions" style="font-size:13px; color:var(--muted);">전체보기</a>
        </div>
        <div id="recentSuggestions"><div class="empty-state">불러오는 중...</div></div>
      </div>
    </div>
  </main>

  <script src="assets/supabaseClient.js?v=20260921b"></script>
  <script src="assets/app.js?v=20260921b"></script>
  <script>
    (async () => {
      const auth = await requireAuth();
      if (!auth) return;
      const { profile } = auth;
      renderGnb("home", profile);
      revealPage();

      // 카운트 조회
      const [
        { count: noticeCount },
        { count: pinnedCount },
        { count: recipeCount },
        { count: newRecipeCount },
        { count: suggestionPendingCount },
        { count: resourceCount },
        { count: orderPendingCount },
        { count: companyCount },
      ] = await Promise.all([
        sb.from("notices").select("*", { count: "exact", head: true }),
        sb.from("notices").select("*", { count: "exact", head: true }).eq("is_pinned", true),
        sb.from("recipes").select("*", { count: "exact", head: true }),
        sb.from("recipes").select("*", { count: "exact", head: true }).gte("created_at", new Date(Date.now() - 14 * 24 * 60 * 60 * 1000).toISOString()),
        sb.from("suggestions").select("*", { count: "exact", head: true }).eq("status", "답변대기"),
        sb.from("resources").select("*", { count: "exact", head: true }),
        sb.from("supply_requests").select("*", { count: "exact", head: true }).eq("status", "요청"),
        sb.from("companies").select("*", { count: "exact", head: true }),
      ]);

      document.getElementById("quickMenuGrid").innerHTML = `
        <a href="recipes" class="card quick-card">
          <div class="quick-icon" style="background:var(--accent-tint); color:var(--accent);">🍹</div>
          <div class="quick-title">레시피</div>
          <div class="quick-desc">신메뉴/기존 메뉴 제조 방법 영상과 레시피 카드를 확인하세요</div>
          <div class="quick-footer"><span class="pill pill-accent">NEW ${newRecipeCount || 0}건</span><span style="font-size:13px; color:var(--muted);">바로가기 ›</span></div>
        </a>
        <a href="notices" class="card quick-card">
          <div class="quick-icon" style="background:var(--amber-tint); color:var(--amber-dark);">📣</div>
          <div class="quick-title">공지사항</div>
          <div class="quick-desc">회사 소식, 정책 변경, 프로모션 안내 등 필독 공지를 확인하세요</div>
          <div class="quick-footer"><span class="pill pill-amber">필독 ${pinnedCount || 0}건</span><span style="font-size:13px; color:var(--muted);">바로가기 ›</span></div>
        </a>
        <a href="suggestions" class="card quick-card">
          <div class="quick-icon" style="background:var(--secondary-tint); color:var(--secondary-dark);">💬</div>
          <div class="quick-title">건의함</div>
          <div class="quick-desc">불편사항·아이디어를 남기고 답변을 받아보세요</div>
          <div class="quick-footer"><span class="pill pill-secondary">답변대기 ${suggestionPendingCount || 0}건</span><span style="font-size:13px; color:var(--muted);">바로가기 ›</span></div>
        </a>
        <a href="orders" class="card quick-card">
          <div class="quick-icon" style="background:var(--secondary-tint); color:var(--secondary-dark);">📦</div>
          <div class="quick-title">본사 발주</div>
          <div class="quick-desc">배망 / 유니폼 / 바스켓 등 발주를 요청하면 담당자가 발주 확인 후 댓글로 안내드려요.</div>
          <div class="quick-footer"><span class="pill pill-secondary">확인대기 ${orderPendingCount || 0}건</span><span style="font-size:13px; color:var(--muted);">바로가기 ›</span></div>
        </a>
        <a href="resources" class="card quick-card">
          <div class="quick-icon" style="background:var(--neutral-tint); color:#6B5B47;">📁</div>
          <div class="quick-title">자료실</div>
          <div class="quick-desc">레시피 파일, 디자인 자료, 배달 등록 누끼 등 파일을 받아볼 수 있습니다.</div>
          <div class="quick-footer"><span class="pill pill-neutral">문서 ${resourceCount || 0}건</span><span style="font-size:13px; color:var(--muted);">바로가기 ›</span></div>
        </a>
        <a href="company" class="card quick-card">
          <div class="quick-icon" style="background:var(--neutral-tint); color:#6B5B47;">🏢</div>
          <div class="quick-title">업체 정보</div>
          <div class="quick-desc">재료·장비 공급업체, AS 센터 등 운영에 필요한 연락처를 확인하세요</div>
          <div class="quick-footer"><span class="pill pill-neutral">${companyCount || 0}곳</span><span style="font-size:13px; color:var(--muted);">바로가기 ›</span></div>
        </a>

        <a href="https://www.kinkos.co.kr/" target="_blank" rel="noopener" class="card quick-card">
          <div class="quick-icon" style="background:var(--info-tint); color:var(--info-dark);">🖨️</div>
          <div class="quick-title">포스터 및 배너 발주</div>
          <div class="quick-desc">매장 포스터·배너 제작을 킨코스 사이트에서 바로 발주하세요</div>
          <div class="quick-footer"><span></span><span style="font-size:13px; color:var(--muted);">바로가기 ›</span></div>
        </a>
        <a href="https://www.oesikup.com/" target="_blank" rel="noopener" class="card quick-card">
          <div class="quick-icon" style="background:var(--green-tint); color:var(--green);">🚚</div>
          <div class="quick-title">물류 발주</div>
          <div class="quick-desc">매장 운영에 필요한 물류를 발주 사이트에서 신청하세요</div>
          <div class="quick-footer"><span></span><span style="font-size:13px; color:var(--muted);">바로가기 ›</span></div>
        </a>
      `;

      // 필독 배너 (필독 공지가 여러 건이면 7초 간격으로 자동으로 다음 공지를 보여주고, 우측 하단 </> 버튼으로 직접 넘길 수도 있습니다)
      const { data: pinnedList } = await sb.from("notices").select("*").eq("is_pinned", true).order("created_at", { ascending: false });
      const bannerEl = document.getElementById("pinnedBanner");
      if (pinnedList && pinnedList.length > 0) {
        let bannerIdx = 0;
        let bannerTimer = null;

        function renderBannerSlide() {
          const n = pinnedList[bannerIdx];
          document.getElementById("bannerText").textContent = n.title;
          document.getElementById("bannerDate").textContent = formatDate(n.created_at);
          bannerEl.querySelectorAll(".banner-dot").forEach((d, i) => d.classList.toggle("active", i === bannerIdx));
        }
        function goToSlide(newIdx) {
          bannerIdx = (newIdx + pinnedList.length) % pinnedList.length;
          renderBannerSlide();
        }
        function restartBannerTimer() {
          if (bannerTimer) clearInterval(bannerTimer);
          if (pinnedList.length > 1) {
            bannerTimer = setInterval(() => goToSlide(bannerIdx + 1), 7000);
          }
        }

        const dotsHtml = pinnedList.length > 1
          ? `<div class="banner-dots">${pinnedList.map((_, i) => `<span class="banner-dot ${i === 0 ? "active" : ""}"></span>`).join("")}</div>`
          : "";
        const navHtml = pinnedList.length > 1 ? `
          <div class="banner-controls">
            <div style="display:flex; gap:4px;">
              <button type="button" id="bannerPrevBtn" class="banner-nav-btn" aria-label="이전 공지">‹</button>
              <button type="button" id="bannerNextBtn" class="banner-nav-btn" aria-label="다음 공지">›</button>
            </div>
            ${dotsHtml}
          </div>
        ` : "";
        bannerEl.innerHTML = `
          <div class="card" style="background:var(--amber-tint); border-color:#F3D9B8; display:flex; align-items:center; gap:14px;">
            <a href="notices" style="display:flex; align-items:center; gap:14px; flex-grow:1; min-width:0; text-decoration:none;">
              <span class="pill pill-amber-solid">필독</span>
              <span id="bannerText" style="font-size:15px; font-weight:500; color:var(--ink); flex-grow:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(pinnedList[0].title)}</span>
              <span id="bannerDate" style="font-size:13px; color:var(--muted); flex-shrink:0;">${formatDate(pinnedList[0].created_at)}</span>
            </a>
            ${navHtml}
          </div>
        `;

        if (pinnedList.length > 1) {
          document.getElementById("bannerPrevBtn").addEventListener("click", (e) => {
            e.preventDefault();
            goToSlide(bannerIdx - 1);
            restartBannerTimer();
          });
          document.getElementById("bannerNextBtn").addEventListener("click", (e) => {
            e.preventDefault();
            goToSlide(bannerIdx + 1);
            restartBannerTimer();
          });
        }
        restartBannerTimer();
      }

      const previewStyle = "overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block;";

      // 최근 공지사항 (공지사항 탭과 동일하게 필독 공지가 항상 최상단에 노출됩니다) - 내용도 20자까지 미리보기로 보여줍니다
      const { data: recentNotices } = await sb.from("notices").select("*").order("is_pinned", { ascending: false }).order("created_at", { ascending: false }).limit(4);
      const noticesHtml = (recentNotices || []).map((n) => `
        <div class="list-row" style="flex-direction:column; align-items:stretch; gap:6px;">
          <div style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
            <div style="display:flex; align-items:center; gap:8px; min-width:0;">
              ${n.is_pinned ? '<span class="pill pill-amber-solid" style="font-size:11px;">필독</span>' : isWithinDays(n.created_at, 7) ? '<span class="pill pill-secondary" style="font-size:11px;">NEW</span>' : ""}
              <span style="font-size:14.5px; font-weight:500; ${previewStyle}">${escapeHtml(n.title)}</span>
            </div>
            <span style="font-size:13px; color:var(--muted); flex-shrink:0;">${formatDate(n.created_at)}</span>
          </div>
          <span style="font-size:13px; color:var(--ink-soft); ${previewStyle}">${escapeHtml(truncate(n.content, 20))}</span>
        </div>
      `).join("");
      document.getElementById("recentNotices").innerHTML = noticesHtml || '<div class="empty-state">등록된 공지사항이 없습니다</div>';

      // 최근 건의사항 (RLS에 의해 본인 글 + 바이저는 전체가 조회됨) - 내용/답변 모두 20자까지만 미리보기로 보여줍니다
      const { data: recentSuggestions } = await sb
        .from("suggestions")
        .select("*, suggestion_replies(content, created_at)")
        .order("created_at", { ascending: false })
        .limit(3);
      const sugHtml = (recentSuggestions || []).map((s) => {
        const replies = s.suggestion_replies || [];
        const latestReply = replies.length
          ? replies.slice().sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0]
          : null;
        return `
        <div class="list-row" style="flex-direction:column; align-items:stretch; gap:6px;">
          <div style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
            <span style="font-size:14.5px; font-weight:500; ${previewStyle} flex-grow:1; min-width:0;">${escapeHtml(s.title)}</span>
            <span style="font-size:13px; color:var(--muted); flex-shrink:0;">${formatDate(s.created_at)}</span>
          </div>
          <span style="font-size:13px; color:var(--ink-soft); ${previewStyle}">${escapeHtml(truncate(s.content, 20))}</span>
          ${latestReply ? `<span style="font-size:12.5px; color:var(--accent-dark); ${previewStyle}">↳ 답변: ${escapeHtml(truncate(latestReply.content, 20))}</span>` : ""}
          <span class="pill ${s.status === "답변완료" ? "pill-green" : "pill-amber"}" style="width:fit-content;">${s.status}</span>
        </div>
      `;
      }).join("");
      document.getElementById("recentSuggestions").innerHTML = sugHtml || '<div class="empty-state">등록된 건의사항이 없습니다</div>';
    })();
  </script>
</body>
</html>
