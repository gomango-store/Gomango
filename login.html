<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOMANGO 점주 운영 게시판 - 로그인</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/style.css?v=20260921d">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div style="text-align:center; display:flex; flex-direction:column; gap:4px;">
        <img src="assets/logo.png?v=20260918" alt="GOMANGO" class="brand-logo" style="height:42px; margin:0 auto;">
        <span style="font-size:13.5px; color:var(--muted);">점주 운영 게시판</span>
      </div>

      <form id="loginForm" style="display:flex; flex-direction:column; gap:14px;">
        <div class="form-field">
          <label for="email">아이디</label>
          <input id="email" type="text" required placeholder="store01" autocomplete="username">
        </div>
        <div class="form-field">
          <label for="password">비밀번호</label>
          <input id="password" type="password" required placeholder="비밀번호를 입력하세요">
        </div>
        <div id="errorMsg" class="error-text hidden"></div>
        <button type="submit" id="submitBtn" class="btn-primary" style="width:100%;">로그인</button>
      </form>

      <div style="font-size:12.5px; color:var(--muted); text-align:center; line-height:1.6;">
        계정이 없으신가요? 바이저(운영 담당자)에게 문의해 계정을 발급받으세요.
      </div>
    </div>
  </div>

  <script src="assets/supabaseClient.js?v=20260921d"></script>
  <script src="assets/app.js?v=20260921d"></script>
  <script>
    const form = document.getElementById("loginForm");
    const errorMsg = document.getElementById("errorMsg");
    const submitBtn = document.getElementById("submitBtn");

    // 이미 로그인되어 있으면 화면을 보여주지 않고 바로 홈으로 이동, 아니면 로그인 폼을 보여줍니다.
    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        location.replace("home");
        return;
      }
      revealPage();
    })();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.classList.add("hidden");
      submitBtn.disabled = true;
      submitBtn.textContent = "로그인 중...";

      const loginId = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const email = idToEmail(loginId);

      const { error } = await sb.auth.signInWithPassword({ email, password });

      submitBtn.disabled = false;
      submitBtn.textContent = "로그인";

      if (error) {
        // 원인 파악이 쉽도록 Supabase가 준 실제 메시지를 함께 보여줍니다.
        let hint = "";
        if (/email not confirmed/i.test(error.message)) {
          hint = " (이메일 인증이 안 된 계정입니다. 바이저가 Supabase 대시보드에서 인증 처리해야 합니다.)";
        } else if (/invalid login credentials/i.test(error.message)) {
          hint = " (아이디 또는 비밀번호가 일치하지 않습니다.)";
        }
        errorMsg.textContent = `로그인 실패: ${error.message}${hint}`;
        errorMsg.classList.remove("hidden");
        return;
      }
      location.href = "home";
    });
  </script>
</body>
</html>
